<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — CrownBridge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0b0f1a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      text-align: center;
      max-width: 520px;
    }

    .logo {
      font-size: 26px;
      font-weight: 700;
      color: #f0b429;
      letter-spacing: 1px;
      margin-bottom: 48px;
    }

    .code {
      font-size: 96px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #f0b429, #d4a017);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 16px;
    }

    p {
      font-size: 16px;
      color: #94a3b8;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-block;
      padding: 13px 28px;
      background: linear-gradient(135deg, #f0b429, #d4a017);
      color: #0b0f1a;
      font-weight: 700;
      font-size: 15px;
      border-radius: 10px;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .btn-primary:hover { opacity: 0.88; }

    .btn-secondary {
      display: inline-block;
      padding: 13px 28px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #e2e8f0;
      font-weight: 600;
      font-size: 15px;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.2s;
    }

    .btn-secondary:hover { background: rgba(255,255,255,0.1); }

    .footer {
      margin-top: 56px;
      font-size: 13px;
      color: #475569;
    }

    .footer a {
      color: #f0b429;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="logo">⚡ CrownBridge</div>

    <div class="code">404</div>

    <h1>Page not found</h1>

    <p>
      The page you're looking for doesn't exist or may have been moved.
      Let's get you back on track.
    </p>

    <div class="actions">
      <a href="/" class="btn-primary">Go to Homepage</a>
      <a href="mailto:support@crownbridgeltd.com" class="btn-secondary">Contact Support</a>
    </div>

    <div class="footer">
      <p>© 2025 CrownBridge · <a href="mailto:support@crownbridgeltd.com">support@crownbridgeltd.com</a></p>
    </div>

  </div>

</body>
</html>
